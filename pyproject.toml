[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-claude-code"
version = "0.1.0"
description = "A terminal-native autonomous coding agent CLI powered by a local PyTorch & FastAPI LLM runtime."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "rich>=13.0.0",
    "prompt_toolkit>=3.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
    "pydantic>=2.0.0",
    "requests>=2.28.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "httpx>=0.24.0"]

[project.scripts]
ccode = "custom_claude.cli:main"

[tool.setuptools.packages.find]
include = ["custom_claude*", "server*", "reverse_eng*", "rebuild_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]
